name: Build Minecraft Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Gradle 8.8
        run: |
          wget https://services.gradle.org/distributions/gradle-8.8-bin.zip -q
          unzip -q gradle-8.8-bin.zip
          echo "$PWD/gradle-8.8/bin" >> $GITHUB_PATH

      - name: Build with Gradle
        run: gradle build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: botmod-1.0.0
          path: build/libs/*.jar
          path: build/libs/*.jar
